<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mulheres Curadas — Em breve</title>

<!-- previa do link no WhatsApp e redes sociais -->
<meta property="og:title" content="Mulheres Curadas 💖">
<meta property="og:description" content="Em breve...">
<meta property="og:image" content="https://mulherescuradas.institutoabner.com.br/capa-mulheres-curadas-v2.jpg">
<meta property="og:url" content="https://mulherescuradas.institutoabner.com.br/">
<meta property="og:type" content="website">
<meta property="og:locale" content="pt_BR">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#c88a80">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    /* paleta oficial Mulheres Curadas: nude #EDD6C4, rosa #EFAEC4, terracota #AF7569 */
    --bg:#170f0d;
    --pink:#c88a80;      /* rosa-queimado (accent principal) */
    --pink-2:#efaec4;    /* rosa suave */
    --orange:#edd6c4;    /* nude */
    --text:#f6efe9;
    --muted:#b6a498;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    font-family:'Poppins',sans-serif;
    -webkit-tap-highlight-color:transparent;
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px 16px;
  }
  /* papel de parede floral fixo atras de todo o conteudo */
  body::before{
    content:"";position:fixed;inset:0;z-index:0;
    background:
      linear-gradient(180deg, rgba(23,15,13,.42), rgba(23,15,13,.66)),
      url("fundo-mulheres-curadas.jpg") center center / cover no-repeat;
  }
  .center{
    position:relative;z-index:1;
    text-align:center;display:flex;flex-direction:column;align-items:center;gap:22px;
    animation:reveal .6s ease both;
  }
  @keyframes reveal{
    from{opacity:0;transform:translateY(16px)}
    to{opacity:1;transform:translateY(0)}
  }
  .logo{width:110px;height:auto;opacity:.95}
  .wordmark{width:min(280px,80vw);height:auto;opacity:.95}
  .embreve{
    font-size:22px;font-weight:600;letter-spacing:4px;text-transform:uppercase;
    background:linear-gradient(90deg,var(--pink) 0%,var(--pink-2) 45%,var(--orange) 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
</style>
</head>
<body>
  <div class="center">
    <img class="logo" src="mc-monograma-claro.png" alt="Mulheres Curadas">
    <img class="wordmark" src="wordmark-mulheres-curadas.png" alt="Mulheres Curadas">
    <p class="embreve">Em breve...</p>
  </div>
</body>
</html>
